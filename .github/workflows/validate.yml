name: Validate research and generated directory
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate canonical data
        run: python3 scripts/validate.py
      - name: Rebuild directory and check generated output
        run: |
          python3 scripts/generate_site.py
          git diff --exit-code -- site/index.html
